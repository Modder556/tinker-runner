name: tinker-run

# Generic runner. The language isn't hardcoded here - Tinker sends the setup and
# run commands as inputs, so new languages are added by writing a profile, never
# by editing this file. That matters because template updates do NOT propagate to
# repos already created from it.
#
# Isolation: each run lives in runs/<token>/ and the run is stamped with that
# token via run-name, so many people can share one repo safely.
#
# Hardening: checkout does not persist credentials, so the program being run
# cannot read a push token out of .git/config. Only the publish step gets one.
run-name: tinker ${{ inputs.token }}

on:
  workflow_dispatch:
    inputs:
      entry:
        description: entry file name
        required: true
      token:
        description: unique run id
        required: true
      command:
        description: shell command that runs the program ($ENTRY is the file)
        required: true
      setup:
        description: optional shell command to install a toolchain first
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # A runaway or malicious profile can't tie up a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare toolchain
        continue-on-error: true
        env:
          SETUP: ${{ inputs.setup }}
        run: |
          if [ -n "$SETUP" ]; then
            echo "running setup: $SETUP"
            eval "$SETUP"
          else
            echo "no setup needed"
          fi

      - name: Run program
        env:
          COMMAND: ${{ inputs.command }}
          ENTRY: ${{ inputs.entry }}
          TOKEN: ${{ inputs.token }}
        run: |
          set +e
          DIR="runs/$TOKEN"
          if [ ! -d "$DIR" ]; then
            mkdir -p "$DIR"
            echo "no source folder found for this run" > "$DIR/output.txt"
            exit 0
          fi
          cd "$DIR"
          {
            echo "---TINKER-OUTPUT-START---"
            eval "$COMMAND"
            echo ""
            echo "---TINKER-OUTPUT-END---"
          } > output.txt 2>&1
          rm -f ./prog
          rm -rf ./jc
          echo "----- captured -----"; cat output.txt

      - name: Publish output
        env:
          TOKEN: ${{ inputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "tinker-bot"
          git config user.email "tinker-bot@users.noreply.github.com"
          # add the whole run folder so profiles can return artifacts (mp4, png...)
          find "runs/$TOKEN" -size +25M -delete 2>/dev/null || true
          git add "runs/$TOKEN"
          git commit -m "output $TOKEN [skip ci]" || echo "nothing to commit"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5 6; do
            if git push "$REMOTE" HEAD:main; then
              echo "pushed on attempt $i"; break
            fi
            echo "push rejected, rebasing (attempt $i)..."
            git pull --rebase "$REMOTE" main || git rebase --abort
            sleep $(( (RANDOM % 4) + 1 ))
          done
